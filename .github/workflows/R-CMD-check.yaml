name: R-CMD-check

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.os }} (release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: smallvis
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: smallvis
          args: 'c("--no-manual")'
          error-on: '"warning"'

  native-quality:
    name: C++ warnings, format, and tidy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM and R headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-21 clang-format-21 clang-tidy-21 r-base-core r-cran-rcpp
      - name: Check handwritten C++
        shell: bash
        run: |
          mapfile -d '' -t files < <(git ls-files -z -- \
            'smallvis/src/*.cpp' 'smallvis/src/*.h' \
            'smallvis/tests/native/*.cpp' 'smallvis/tests/native/*.h' \
            ':!smallvis/src/RcppExports.*')
          sources=()
          for file in "${files[@]}"; do
            if [[ "$file" == *.cpp ]]; then
              sources+=("$file")
            fi
          done
          test "${#sources[@]}" -gt 0

          r_include=$(Rscript --vanilla -e 'cat(R.home("include"))')
          rcpp_include=$(Rscript --vanilla -e 'cat(system.file("include", package = "Rcpp", mustWork = TRUE))')
          flags=(-std=c++17 -pthread -fPIC -isystem "$r_include" -isystem "$rcpp_include")

          echo "Checking compiler warnings"
          for file in "${sources[@]}"; do
            clang++-21 "${flags[@]}" -O2 -Wall -Wextra -Wpedantic -Werror \
              -c "$file" -o /dev/null
          done

          echo "Checking clang-format"
          clang-format-21 --style=LLVM --dry-run --Werror "${files[@]}"

          echo "Checking clang-tidy"
          clang-tidy-21 --warnings-as-errors='*' \
            --checks='-*,clang-analyzer-core.*,bugprone-use-after-move,bugprone-unused-raii,performance-unnecessary-copy-initialization' \
            --header-filter='(^|/)smallvis/(src|tests/native)/' \
            "${sources[@]}" -- "${flags[@]}"

  native-sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Barnes-Hut and threading harnesses
        working-directory: smallvis
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          clang++ --version
          for harness in bh threads; do
            echo "Checking ${harness}"
            binary="${RUNNER_TEMP}/smallvis-${harness}"
            clang++ -std=c++17 -O1 -g -pthread -Wall -Wextra -Wpedantic -Werror \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -fno-omit-frame-pointer "tests/native/${harness}.cpp" -o "$binary"
            timeout --kill-after=5s 30s "$binary"
          done
