name: lint

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: smallvis
          extra-packages: any::lintr@3.4.0, any::pkgload
          needs: lint
      - name: Lint
        working-directory: smallvis
        shell: Rscript {0}
        run: |
          stopifnot(as.character(utils::packageVersion("lintr")) == "3.4.0")
          pkgload::load_all()
          lints <- lintr::lint_package()
          print(lints)
          quit(status = if (length(lints) > 0L) 1L else 0L)
